apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-admin
  namespace: claw-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: claw-admin }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-admin
        app.kubernetes.io/part-of: claw
    spec:
      serviceAccountName: claw-admin
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: admin
          image: registry.invalid/claw/admin:replace
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: frontend-runtime-config, mountPath: /usr/share/nginx/html/runtime-config.js, subPath: runtime-config.js, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - name: frontend-runtime-config
          configMap:
            name: claw-frontend-runtime-config
            items:
              - { key: admin-runtime-config.js, path: runtime-config.js }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: nginx-cache
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
        - name: nginx-run
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: claw-admin
  namespace: claw-prod
spec:
  selector: { app.kubernetes.io/name: claw-admin }
  ports: [{ name: http, port: 8080, targetPort: http }]
