apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-indexer
  namespace: claw-prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: claw-indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-indexer
        app.kubernetes.io/part-of: claw
    spec:
      serviceAccountName: claw-indexer
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: registry.invalid/claw/backend:replace
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/indexer"
            - start
          env:
            - name: NODE_ENV
              value: production
          ports:
            - name: control
              containerPort: 9900
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: control
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: envio-generated
              mountPath: /app/services/indexer/.envio
            - name: state
              mountPath: /var/lib/claw-indexer
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: indexer.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-indexer-password
                path: database-indexer-password
              - key: indexer-release-control-token
                path: indexer-release-control-token
              - key: internal-api-key
                path: internal-api-key
        - name: state
          emptyDir: {}
        - name: envio-generated
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
