apiVersion: v1
kind: Service
metadata:
  name: claw-postgres
  namespace: claw-prod
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: claw-postgres-host
  namespace: claw-prod
  labels:
    kubernetes.io/service-name: claw-postgres
addressType: IPv4
endpoints:
  - addresses: ["10.54.0.1"]
ports:
  - name: postgres
    port: 5432
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: claw-indexer-postgres
  namespace: claw-prod
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5433
      protocol: TCP
      targetPort: 5433
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: claw-indexer-postgres-host
  namespace: claw-prod
  labels:
    kubernetes.io/service-name: claw-indexer-postgres
addressType: IPv4
endpoints:
  - addresses: ["10.54.0.1"]
ports:
  - name: postgres
    port: 5433
    protocol: TCP
