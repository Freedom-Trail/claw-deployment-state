apiVersion: apps/v1
kind: Deployment
metadata:
  name: claw-web
  namespace: claw-prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claw-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-web
        app.kubernetes.io/part-of: claw
    spec:
      serviceAccountName: claw-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.invalid/claw/web:replace
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 20
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: web.json
                path: config.json
---
---
apiVersion: v1
kind: Service
metadata:
  name: claw-web
  namespace: claw-prod
spec:
  selector: { app.kubernetes.io/name: claw-web }
  ports: [ { name: http, port: 8080, targetPort: http } ]
