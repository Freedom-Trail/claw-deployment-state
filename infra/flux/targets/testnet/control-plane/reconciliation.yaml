apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claw-gate
  namespace: claw-flux-testnet
  labels:
    delivery.claw.io/environment: testnet
    delivery.claw.io/stage: gate
    delivery.claw.io/intent-id: claw-a22990fd372523a571373f15c8d3c70bc770bdb9
    delivery.claw.io/release-sha: "a22990fd372523a571373f15c8d3c70bc770bdb9"
spec:
  interval: 2m
  retryInterval: 1m
  timeout: 15m
  suspend: false
  path: ./infra/flux/targets/testnet/stages/gate
  sourceRef:
    kind: GitRepository
    name: claw-testnet
  targetNamespace: claw-testnet
  serviceAccountName: claw-flux-reconciler
  prune: false
  deletionPolicy: Orphan
  wait: true
  healthChecks:
    - apiVersion: delivery.claw.io/v1alpha2
      kind: ClawRelease
      name: claw-a22990fd372523a571373f15c8d3c70bc770bdb9
      namespace: claw-testnet
  healthCheckExprs:
    - apiVersion: delivery.claw.io/v1alpha2
      kind: ClawRelease
      inProgress: >-
        has(status.phase) && status.phase in ['PENDING', 'VERIFYING']
      failed: >-
        has(status.phase) && status.phase in ['BLOCKED', 'FAILED']
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        status.observedIntentDigest == spec.intentDigest &&
        status.conditions.exists(c,
          c.type == 'GateReady' && c.status == 'True' &&
          c.observedGeneration == metadata.generation)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claw-migration
  namespace: claw-flux-testnet
  labels:
    delivery.claw.io/environment: testnet
    delivery.claw.io/stage: migration
    delivery.claw.io/intent-id: claw-a22990fd372523a571373f15c8d3c70bc770bdb9
    delivery.claw.io/release-sha: "a22990fd372523a571373f15c8d3c70bc770bdb9"
spec:
  dependsOn:
    - name: claw-gate
      readyExpr: >-
        dep.metadata.labels['delivery.claw.io/intent-id'] == self.metadata.labels['delivery.claw.io/intent-id'] &&
        dep.metadata.labels['delivery.claw.io/release-sha'] == self.metadata.labels['delivery.claw.io/release-sha'] &&
        dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
  interval: 2m
  retryInterval: 1m
  timeout: 15m
  suspend: false
  path: ./infra/flux/targets/testnet/stages/migration
  sourceRef:
    kind: GitRepository
    name: claw-testnet
  targetNamespace: claw-testnet
  serviceAccountName: claw-flux-reconciler
  prune: false
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claw-backend
  namespace: claw-flux-testnet
  labels:
    delivery.claw.io/environment: testnet
    delivery.claw.io/stage: backend
    delivery.claw.io/intent-id: claw-a22990fd372523a571373f15c8d3c70bc770bdb9
    delivery.claw.io/release-sha: "a22990fd372523a571373f15c8d3c70bc770bdb9"
spec:
  dependsOn:
    - name: claw-migration
      readyExpr: >-
        dep.metadata.labels['delivery.claw.io/intent-id'] == self.metadata.labels['delivery.claw.io/intent-id'] &&
        dep.metadata.labels['delivery.claw.io/release-sha'] == self.metadata.labels['delivery.claw.io/release-sha'] &&
        dep.status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True') &&
        dep.metadata.generation == dep.status.observedGeneration
  interval: 2m
  retryInterval: 1m
  timeout: 15m
  suspend: false
  path: ./infra/flux/targets/testnet/stages/backend
  sourceRef:
    kind: GitRepository
    name: claw-testnet
  targetNamespace: claw-testnet
  serviceAccountName: claw-flux-reconciler
  prune: true
  deletionPolicy: Orphan
  wait: true
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: Deployment
      inProgress: >-
        !has(status.observedGeneration) ||
        status.observedGeneration != metadata.generation ||
        !has(status.updatedReplicas) || status.updatedReplicas != spec.replicas ||
        !has(status.readyReplicas) || status.readyReplicas != spec.replicas ||
        !has(status.availableReplicas) || status.availableReplicas != spec.replicas ||
        (has(status.unavailableReplicas) && status.unavailableReplicas != 0)
      failed: >-
        has(status.conditions) &&
        status.conditions.exists(c,
          c.type == 'Progressing' && c.status == 'False')
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.updatedReplicas) && status.updatedReplicas == spec.replicas &&
        has(status.readyReplicas) && status.readyReplicas == spec.replicas &&
        has(status.availableReplicas) && status.availableReplicas == spec.replicas &&
        (!has(status.unavailableReplicas) || status.unavailableReplicas == 0)
---
