apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-65437300fb359c69eb322715357150434f8856bd
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:b782cd81aace41ac49abdfddb4777c2c2f21b51b2fb5bfc3b5422b45fbdb39cc
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-65437300fb359c69eb322715357150434f8856bd
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-65437300fb359c69eb322715357150434f8856bd
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:4d0f71a754aa0a6aa240d8fa3a211b8605207b72481681990cff635a191efa03
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/api"
            - release:migrate
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: migration.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-ca
                path: database-ca
              - key: database-migrator-url
                path: database-migrator-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
