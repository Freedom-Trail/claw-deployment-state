apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-3ba7d00362418d0dad1a9602f3c2ee8faaf18285
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:de217f2eafe3515a97c989e9faa7c70ad85f3d2421d94dbffb052e225e7f8018
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-3ba7d00362418d0dad1a9602f3c2ee8faaf18285
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-3ba7d00362418d0dad1a9602f3c2ee8faaf18285
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:86abde77f471072e672c9c4a9413115ff5d550b104cefbb3d7333e93b80377b8
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/api"
            - release:migrate
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: migration.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-ca
                path: database-ca
              - key: database-migrator-url
                path: database-migrator-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
