apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-0560d6ee26e294875ab9d6f9822ba9ba08b4eb95
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:b1e6264f3dc0194a0cee34a558868b9a09a4efc8f3bc861ffd044d7b8cdbeeaf
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-0560d6ee26e294875ab9d6f9822ba9ba08b4eb95
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-0560d6ee26e294875ab9d6f9822ba9ba08b4eb95
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:4c75baaad70536f38eca6d9b64f6b068691177e31930d5c282aa4a51e3457377
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/api"
            - release:migrate
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: migration.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-ca
                path: database-ca
              - key: database-migrator-url
                path: database-migrator-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
