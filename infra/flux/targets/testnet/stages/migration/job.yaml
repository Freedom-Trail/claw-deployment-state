apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-4b309a58a8900f68fe0b2d8a6cb220019a1e3f2c
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:4be98b47f20518094652c8b903944d38e6561c90c11478e3b5fb35bcf618c306
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-4b309a58a8900f68fe0b2d8a6cb220019a1e3f2c
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-4b309a58a8900f68fe0b2d8a6cb220019a1e3f2c
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:4c1df9e7ac457b03088a4c681e2c9f842aa11c2aa7ccdfebdfa8b53b4da919b4
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/api"
            - release:migrate
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: migration.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-ca
                path: database-ca
              - key: database-migrator-url
                path: database-migrator-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
