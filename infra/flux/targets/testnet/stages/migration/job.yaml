apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-dea7722569119d4b0a8bddb8cd80d1d4f02cfde5
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:e70a0bfa9c7af572a477b86cc15e2962bdb51d5254428186b709f12fdfe8abfa
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-dea7722569119d4b0a8bddb8cd80d1d4f02cfde5
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-dea7722569119d4b0a8bddb8cd80d1d4f02cfde5
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:14719b3cedf714b1a34a5e954f8de3f4236ddbd7191855df6c1f3a284ad90655
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - --filter
            - "@claw/api"
            - release:migrate
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/claw/config.json
              subPath: config.json
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/claw
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items:
              - key: migration.json
                path: config.json
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 288
            items:
              - key: database-ca
                path: database-ca
              - key: database-migrator-url
                path: database-migrator-url
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
