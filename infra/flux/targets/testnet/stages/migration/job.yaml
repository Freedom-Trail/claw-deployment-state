apiVersion: batch/v1
kind: Job
metadata:
  name: claw-migrate-claw-42a1ae5c6d20f87ed375958a9cf12e52cf43df51
  namespace: claw-testnet
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    delivery.claw.io/migration-authorization-digest: sha256:3795b38e84017742f090354ec704977edd8df5d6d4b5dea549488a3285e0d1d6
  labels:
    app.kubernetes.io/name: claw-migrator
    claw.io/release-id: claw-42a1ae5c6d20f87ed375958a9cf12e52cf43df51
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claw-migrator
        claw.io/release-id: claw-42a1ae5c6d20f87ed375958a9cf12e52cf43df51
    spec:
      restartPolicy: OnFailure
      serviceAccountName: claw-migrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: 127.0.0.1:5000/claw/backend@sha256:bfce04eed3d771c1e233b70b6fe57a8ea4cb7c74588e02d750c4ea68cfd1e70c
          imagePullPolicy: IfNotPresent
          command: ["pnpm", "--filter", "@claw/api", "release:migrate"]
          env:
            - { name: NODE_ENV, value: production }
            - { name: CLAW_ENV, value: testnet }
            - { name: CLAW_CONFIG_FILE, value: /etc/claw/config/api.json }
            - { name: CLAW_SECRETS_DIR, value: /run/secrets/claw }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/claw/config, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/claw, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: claw-service-configs
            items: [{ key: api.json, path: api.json }]
        - name: secrets
          secret:
            secretName: claw-runtime-secrets
            defaultMode: 0440
            items:
              - { key: bsc-rpc-url, path: claw/testnet/shared/bsc-rpc-url }
              - { key: database-migrator-url, path: claw/testnet/database/api-url }
              - { key: database-ca, path: claw/testnet/database/ca.crt }
              - { key: auth-session-secret, path: claw/testnet/auth/session-secret }
              - { key: auth-admin-token, path: claw/testnet/auth/admin-token }
              - { key: internal-api-key, path: claw/testnet/shared/internal-api-key }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
